/* Terrarium — a warm, wood-and-parchment keeper's desk. Single committed
   dark-wood theme; every colour is a token. Layout: one-screen app, the
   enclosure owns the middle, HUD above, dock below, sheets slide up. */
:root {
  --bg: #1d1512;
  --wood: #3b2a21;
  --wood-hi: #5a4131;
  --wood-lo: #23180f;
  --paper: #f3e7c9;
  --paper-2: #e5d3ab;
  --paper-3: #d6c193;
  --ink: #2c1f17;
  --ink-soft: #6b5544;
  --moss: #5a8c38;
  --moss-hi: #79ad4b;
  --moss-lo: #3d6526;
  --gold: #f2b83a;
  --gem: #5ad8e8;
  --danger: #c4483a;
  --cream: #fff6dc;
  --r-common: #8e8a78;
  --r-uncommon: #4f9a41;
  --r-rare: #3a7ed0;
  --r-legendary: #a55ad8;
  --r-exotic: #e0921e;
  --font: 'Pixeloid Sans', 'Courier New', ui-monospace, monospace;
  --font-b: 'Pixeloid Sans Bold', 'Pixeloid Sans', 'Courier New', monospace;
  --font-m: 'Pixeloid Mono', 'Courier New', monospace;
  --fs: 14px;
  color-scheme: dark;
}
:root.large-text { --fs: 16px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--paper);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.35;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-font-smoothing: none;
  touch-action: manipulation;
}
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wood-lo); }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app {
  height: 100%;
  display: grid;

  const canvas = h('canvas', { id: 'scene', 'aria-label': 'Terrarium' });
  const floaters = h('div', { class: 'floaters' });
  const bowlBtn = h('button', { class: 'daily-bowl', type: 'button', 'aria-label': 'Daily treat bowl: tap to collect free treats', hidden: true });
  const stage = h('main', { class: 'stage' }, canvas, floaters, bowlBtn);
  const ctxBar = h('section', { class: 'ctx', 'aria-live': 'polite' });
  const dock = h('footer', { class: 'dock' });
  app.replaceChildren(hud, tabs, stage, ctxBar, dock);

  const scene = new Scene(canvas);
  scene.setTerrarium(state.active);
  scene.sync(state, { animateNew: false });

  function applySettings() {
    document.documentElement.classList.toggle('large-text', !!state.settings.largeText);
    document.documentElement.classList.toggle('reduce-motion', !!state.settings.reduceMotion);
    scene.reduceMotion = !!state.settings.reduceMotion;
    scene.phaseOverride = state.test.phaseOverride;
    configureAudio(state.settings);
  }
  applySettings();

  function resize() {
    const r = stage.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const BOWL_ROOM = 26; // headroom so the daily bowl on the lid is never clipped
    let s = Math.min((r.width * dpr) / SCENE.W, ((r.height - BOWL_ROOM) * dpr) / SCENE.H);
    // integer scaling keeps pixels perfectly even; on dense screens a
    // quarter-step is visually indistinguishable and uses the space better
    if (dpr >= 2 && s >= 2) s = Math.floor(s * 4) / 4;
    else if (s >= 2) s = Math.floor(s);
    else if (s >= 1) s = Math.floor(s * 2) / 2;
    s = Math.max(0.5, s);
    canvas.style.width = (SCENE.W * s) / dpr + 'px';
    canvas.style.height = (SCENE.H * s) / dpr + 'px';
    canvas.style.marginTop = BOWL_ROOM + 'px';
    placeBowl();
  }
  // The daily bowl sits on the lid of the terrarium.
  function placeBowl() {
    const cr = canvas.getBoundingClientRect(),
      sr = stage.getBoundingClientRect();
    const lid = (12 / SCENE.H) * cr.height;
    bowlBtn.style.left = cr.left - sr.left + cr.width / 2 + 'px';
    bowlBtn.style.top = cr.top - sr.top + lid + 'px';
  }
  function renderBowl() {
    const avail = G.dailyAvailable(state);
    bowlBtn.hidden = !avail;
    if (avail && !bowlBtn.firstChild) bowlBtn.append(img(art.icon('treatbowl', 3), 'px', ''), h('span', { class: 'daily-tag' }, 'Daily treats'));
    placeBowl();
  }
  onTap(bowlBtn, () => {
    unlockAudio();
    const res = G.claimDaily(state);
    if (!res.ok) return renderBowl();
    sfx('gem');
    save();
    renderBowl();
    refreshSheets();
    const counts = {};
    res.gifts.forEach((g) => g.treats.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
    modal(
      h('div', {},
        h('div', { class: 'eyebrow' }, 'Daily treat bowl'),
        img(art.icon('treatbowl', 4), 'px', ''),
        h('h3', {}, `${Object.values(counts).reduce((a, b) => a + b, 0)} treats for your visitors`),
        h('div', { class: 'treat-pick' },
          res.gifts.map((g) => h('div', { class: 'gift-row' }, h('b', {}, SHORT[g.terr]), h('span', { class: 'gift-items' }, g.treats.map((t) => img(art.treat(TREAT_BY_ID[t], 2), 'px', TREAT_BY_ID[t].name)))))
        ),
        h('p', {}, Object.entries(counts).map(([t, n]) => `${TREAT_BY_ID[t].name} ×${n}`).join(' · ')),
        h('p', { class: 'note' }, 'The bowl refills at midnight. Unlock more terrariums for more treats.')
      ),
      { actions: [{ label: 'Thanks!', primary: true }] }
    );
  });
  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(stage);

  // ── Helpers ────────────────────────────────────────────────────────────────
  const now = () => G.gameNow(state, Date.now());
  const ts = () => state.terrariums[state.active];
  const known = (spId) => !!state.journal[spId];
  const coinImg = () => img(art.coin(2), 'px', 'coins');
  const gemImg = () => img(art.gem(2), 'px', 'gems');
  const priceEl = (cost) =>
    h('span', { class: 'price' }, cost.coins ? [coinImg(), fmt(cost.coins)] : null, cost.gems ? [gemImg(), fmt(cost.gems)] : null);
  const rarityChip = (tier) => h('span', { class: 'chip r-' + tier }, TIER_LABEL[tier]);
  const canAfford = (c) => (c.coins || 0) <= state.coins && (c.gems || 0) <= state.gems;

  function floater(text, sx, sy, icon) {
    const cr = canvas.getBoundingClientRect(),
      sr = stage.getBoundingClientRect();
    const x = cr.left - sr.left + (sx / SCENE.W) * cr.width;
    const y = cr.top - sr.top + (sy / SCENE.H) * cr.height - 10;
    const el = h('div', { class: 'floater', style: { left: x + 'px', top: y + 'px' } }, icon ? img(icon, 'px') : null, text);
    floaters.append(el);
    setTimeout(() => el.remove(), 1300);
  }
  function bump(sel) {
    const el = hud.querySelector(sel);
    if (!el) return;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  // ── HUD ───────────────────────────────────────────────────────────────────
  function renderHud() {
    const light = lightingAt(now(), state.test.phaseOverride);
    const ph = light.phase;
    const next = ph === 'night' ? 'dawn' : ph === 'day' ? 'dusk' : ph === 'dusk' ? 'night' : 'day';
    const phaseLabel = { dawn: 'Dawn', day: 'Day', dusk: 'Dusk', night: 'Night' }[ph];
    const coins = h('button', { class: 'pill coins', 'aria-label': `${state.coins} coins` }, coinImg(), h('b', {}, fmt(state.coins)));
    const gems = h('button', { class: 'pill gems', 'aria-label': `${state.gems} gems` }, gemImg(), h('b', {}, fmt(state.gems)));
    onTap(coins, () => openProgress());
    onTap(gems, () => toast('Gems are rare. Earn them from drops, discoveries and finished field plates.', { icon: art.gem(2), ms: 3200 }));
    const phase = h('button', { class: 'pill phase', 'aria-label': 'Time of day' }, img(art.icon(ph === 'night' || ph === 'dusk' ? 'moon' : 'sun', 2), 'px'), h('span', {}, phaseLabel), state.test.phaseOverride ? h('small', {}, 'locked') : h('small', {}, `${next} ${phaseStartLabel(next).replace(/\s?(AM|PM)$/i, (m) => m.trim().toLowerCase())}`));
    onTap(phase, () => toast(`Terrariums follow your real clock. Dawn ${phaseStartLabel('dawn')} · dusk ${phaseStartLabel('dusk')} · night ${phaseStartLabel('night')}. Nocturnal visitors sometimes nap in a hide during the day.`, { ms: 5200 }));
    const kids = [coins, gems, h('div', { class: 'spacer' }), phase];
    if (state.settings.testMode) {
      const tb = button(img(art.icon('flask', 2), 'px'), () => openTest(), 'btn-icon btn-ghost', { 'aria-label': 'Test tools' });
      kids.push(tb);
    }
    kids.push(button(img(art.icon('gear', 2), 'px'), () => openSettings(), 'btn-icon btn-ghost', { 'aria-label': 'Settings' }));
    hud.replaceChildren(...kids);
  }

  // ── Terrarium tabs ────────────────────────────────────────────────────────
  function renderTabs() {
    tabs.replaceChildren(
      ...TERRARIUMS.map((t) => {
        const unlocked = state.unlocked[t.id];
        const tsx = state.terrariums[t.id];
        const badge = h('span', { class: 'badge' });
        if (unlocked && t.id !== state.active) {
          if (tsx.visitors.length) badge.append(h('i', { class: 'dot', title: 'visitors' }));
          if (tsx.drops.length) badge.append(h('i', { class: 'dot coin', title: 'coins' }));
        }
        const b = h('button', { class: 'tab' + (t.id === state.active ? ' active' : '') + (unlocked ? '' : ' locked'), 'aria-pressed': String(t.id === state.active), 'aria-label': t.name + (unlocked ? '' : ' (locked)') }, img(art.icon(t.icon, 2), 'px'), h('span', {}, SHORT[t.id]), badge, unlocked ? null : img(art.icon('lock', 1), 'px lock'));
        onTap(b, () => {
          if (!unlocked) return openShop('habitats');
          switchTo(t.id);
        });
        return b;
      })
    );
  }
  function switchTo(id) {
    if (state.active === id) return;
    state.active = id;
    scene.setTerrarium(id);
    scene.sync(state, { animateNew: false });
    sfx('tap');
    setAmbience(id, lightingAt(now()).dark > 0.5);
    save();
    renderAll();
  }

  // ── Dock ───────────────────────────────────────────────────────────────────
  function renderDock() {
    const mk = (icon, label, fn) => button([img(art.icon(icon, 2), 'px'), h('span', {}, label)], fn);
    dock.replaceChildren(mk('shop', 'Shop', () => openShop()), mk('journal', 'Journal', () => openJournal()), mk('box', 'Mementos', () => openMementos()), mk('sprout', 'Progress', () => openProgress()));
  }

  // ── Context bar ───────────────────────────────────────────────────────────
  function renderCtx() {
    if (scene.arrange) {
      const d = DECOR_BY_ID[scene.arrange.decorId];
      ctxBar.replaceChildren(h('div', { class: 'card status' }, h('span', { class: 'grow' }, `Tap a glowing spot to move ${d.name}.`), button('Done', () => endArrange(), 'btn-primary btn-sm')));
      return;
    }
    const v = scene.selected && ts().visitors.find((x) => x.uid === scene.selected);
    if (!v) {
      const n = ts().visitors.length,
        m = ts().drops.length;
      const parts = [];
      parts.push(n ? `${n} visitor${n > 1 ? 's' : ''} here` : 'No visitors right now');
      if (m) parts.push(`${m} coin pile${m > 1 ? 's' : ''}`);
      const hint = n ? 'Tap a visitor to record it.' : m ? 'Tap a pile to collect it.' : 'Someone will wander by soon.';
      const full = m >= BALANCE.drops.maxPilesPerTerrarium ? ' The tray is full!' : '';
      ctxBar.replaceChildren(
        h('div', { class: 'status' }, h('div', { class: 'grow' }, h('div', {}, parts.join(' · ')), h('small', {}, hint + full)), m > 1 ? button([coinImg(), 'Collect all'], () => collectAll(), 'btn-gold') : null)
      );
      return;
    }
    const sp = SPECIES_BY_ID[v.sp];
    const isNew = !known(sp.id);
    const recBtn = button(v.recorded ? 'Recorded ✓' : [img(art.icon('pencil', 2), 'px'), 'Record sighting'], () => doRecord(v.uid), 'btn-primary', { disabled: v.recorded });
    const feedBtn = button(v.fed ? 'Fed ♥' : [img(art.icon('bowl', 2), 'px'), 'Feed'], () => openFeed(v.uid), '', { disabled: v.fed });
    const close = button('✕', () => select(null), 'btn-icon btn-sm btn-ghost', { 'aria-label': 'Deselect', style: { color: 'var(--ink)', borderColor: 'transparent' } });
    ctxBar.replaceChildren(
      h('div', { class: 'card visitor-card' },
        h('div', { class: 'portrait' }, img(art.creature(sp, sp.art.scale && sp.art.scale < 1 ? 1 : 1), 'px')),
        h('div', {},
          h('div', { class: 'title' }, sp.name),
          h('div', { class: 'meta' }, rarityChip(sp.tier), h('span', { class: 'chip' }, CAT_LABEL[sp.category]), sp.fantasy ? h('span', { class: 'chip chip-fantasy' }, 'Halloween') : null, sp.activity === 'nocturnal' ? h('span', { class: 'chip' }, 'Nocturnal') : null, v.sleeping ? h('span', { class: 'chip' }, 'Asleep') : null, isNew ? h('span', { class: 'chip', style: { background: 'var(--gold)' } }, 'New!') : null)
        ),
        close,
        h('div', { class: 'acts' }, recBtn, feedBtn)
      )
    );
  }

  function select(uid) {
    scene.selected = uid;
    renderCtx();
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  canvas.addEventListener('pointerdown', (ev) => {
    unlockAudio();
    const r = canvas.getBoundingClientRect();
    const sx = ((ev.clientX - r.left) / r.width) * SCENE.W;
    const sy = ((ev.clientY - r.top) / r.height) * SCENE.H;
    const hit = scene.hit(sx, sy);
    if (!hit) {
      if (!scene.arrange) select(null);
      return;
    }
    if (hit.type === 'drop') collect(hit.uid);
    else if (hit.type === 'visitor') {
      sfx('tap');
      select(hit.uid);
    } else if (hit.type === 'spot') {
      if (G.moveDecor(state, state.active, scene.arrange.decorId, hit.spot.id)) {
        sfx('buy');
        scene.sync(state);
        save();
      }
    }
  });

  function collect(uid, quiet = false) {
    const d = ts().drops.find((x) => x.uid === uid);
    const res = G.collectDrop(state, state.active, uid);
    if (!res) return null;
    scene.coinBurst(d.x, d.y, res.gems);
    if (!quiet) {
      if (res.coins) floater('+' + res.coins, d.x, d.y - 6, art.coin(2));
      if (res.gems) setTimeout(() => floater('+' + res.gems, d.x, d.y - 12, art.gem(2)), 150);
      sfx(res.gems ? 'gem' : 'coin');
    }
    if (res.coins) bump('.coins');
    if (res.gems) bump('.gems');
    if (res.mementoNew) {
      const m = MEMENTO_BY_ID[d.memento];
      sfx('memento');
      modal(h('div', {}, h('div', { class: 'eyebrow' }, 'Memento found'), img(art.memento(m, 4), 'px', m.name), h('h3', {}, m.name), h('p', {}, m.desc), h('p', {}, `Left by the ${SPECIES_BY_ID[m.species].name}. Added to your Mementos.`)), { actions: [{ label: 'Treasure it', primary: true }] });
    } else if (res.mementoDupe) toast(`Another ${MEMENTO_BY_ID[d.memento].name}! Traded for ${BALANCE.drops.duplicateMementoGems} gems.`, { icon: art.gem(2) });
    scene.sync(state);
    save();
    renderAll();
    return res;
  }
  function collectAll() {
    let c = 0,
      g = 0;
    for (const d of [...ts().drops]) {
      const r = collect(d.uid, true);
      if (r) (c += r.coins), (g += r.gems);
    }
    sfx(g ? 'gem' : 'coin');
    toast(`Collected ${c} coins${g ? ` and ${g} gem${g > 1 ? 's' : ''}` : ''}.`, { icon: art.coin(2) });
  }

  function doRecord(uid) {
    const res = G.recordSighting(state, state.active, uid);
    if (!res) return;
    scene.flash();
    sfx('record');
    const a = scene.anchorOf(uid);
    if (a) floater('+' + res.coins, a.x, a.y, art.coin(2));
    bump('.coins');
    if (res.gems) bump('.gems');
    save();
    renderAll();
    const sp = res.sp;
    const e = res.entry;
    const rewards = h('div', { class: 'reward-row' }, h('span', {}, coinImg(), '+' + res.coins), res.gems ? h('span', {}, gemImg(), '+' + res.gems) : null);
    if (res.isNew) {
      sfx('discover');
      modal(h('div', {}, h('div', { class: 'eyebrow' }, 'New species recorded'), img(art.sketch(sp, e.stage), 'px art', sp.name), h('h3', {}, sp.name), h('p', {}, `${TIER_LABEL[sp.tier]} ${CAT_LABEL[sp.category].toLowerCase()}. Your first sketch is… a start.`), rewards, res.milestone ? h('p', {}, `Milestone: ${res.milestone} species discovered!`) : null), { actions: [{ label: 'Open journal', value: 'j' }, { label: 'Lovely', primary: true }] }).then((v) => v === 'j' && openJournal(sp.id));
    } else if (res.stageUp) {
      sfx('discover');
      modal(h('div', {}, h('div', { class: 'eyebrow' }, res.mastered ? 'Field guide complete' : 'Sketch improved'), img(art.sketch(sp, e.stage), 'px art', sp.name), h('h3', {}, STAGE_NAMES[e.stage]), h('p', {}, res.mastered ? `Your ${sp.name} plate is finished. Future sightings earn bonus field notes.` : `${e.sightings} sightings of the ${sp.name}. Your drawing is getting better!`), rewards));
    } else {
      const nt = G.nextThreshold(sp, e.sightings);
      toast(nt ? `Sighting #${e.sightings} recorded. ${nt - e.sightings} more for a better sketch.` : `Field notes added: sighting #${e.sightings}.`, { icon: art.icon('pencil', 2) });
    }
  }

  function openFeed(uid) {
    const v = ts().visitors.find((x) => x.uid === uid);
    if (!v) return;
    const sp = SPECIES_BY_ID[v.sp];
    const list = TREATS.filter((t) => t.category === sp.category);
    const content = h('div', {},
      h('h3', {}, `Feed the ${sp.name}`),
      h('p', {}, `${CAT_LABEL[sp.category]} treats only. Rarer visitors give more. Fed visitors stay longer and leave a bigger pile.`),
      h('div', { class: 'treat-pick' },
        list.map((t) => {
          const have = state.treats[t.id] || 0;
          const reward = G.feedReward(state, state.active, sp, t);
          const b = h('button', { class: 'btn', type: 'button', disabled: !have }, h('span', { class: 'l' }, img(art.treat(t, 2), 'px'), `${t.name} ×${have}`), h('span', { class: 'price' }, '+', coinImg(), reward));
          b.dataset.treat = t.id;
          return b;
        })
      )
    );
    let fed = false;
    content.querySelectorAll('.treat-pick .btn').forEach((b) =>
      b.addEventListener('click', () => {
        if (fed) return;
        fed = true;
        content.querySelectorAll('.treat-pick .btn').forEach((x) => (x.disabled = true));
        const res = G.feed(state, state.active, uid, b.dataset.treat);
        b.closest('.modal-wrap')?.querySelector('.modal-actions .btn')?.click();
        if (!res.ok) return toast(res.reason === 'gone' ? 'They wandered off.' : 'Can’t feed that right now.');
        scene.heart(uid, res.treat.tier === 3 ? 'smile' : 'heart');
        sfx('feed');
        const a = scene.anchorOf(uid);
        if (a) floater('+' + res.coins, a.x, a.y - 4, art.coin(2));
        bump('.coins');
        save();
        renderAll();
      })
    );
    const hasAny = list.some((t) => state.treats[t.id] > 0);
    modal(content, { actions: [{ label: 'Cancel', value: 'x' }, ...(hasAny ? [] : [{ label: 'Buy treats', primary: true, value: 'shop' }])] }).then((r) => r === 'shop' && openShop('treats'));
  }

  // ── Events from the simulation ────────────────────────────────────────────
  let bannerEl = null;
  function banner(text) {
    bannerEl?.remove();
    bannerEl = h('div', { class: 'banner' }, text);
    stage.append(bannerEl);
    const el = bannerEl;
    setTimeout(() => el.remove(), 3200);
  }
  function handleEvents(evs, quiet = false) {
    let arrived = null;
    for (const e of evs) {
      if (e.terr !== state.active) continue;
      if (e.type === 'arrive' && !e.offline) arrived = e.visitor;
    }
    if (arrived && !quiet) {
      const sp = SPECIES_BY_ID[arrived.sp];
      sfx('arrive');
      const rare = ['rare', 'legendary', 'exotic'].includes(sp.tier);
      banner(known(sp.id) ? `${rare ? '✦ ' : ''}A ${sp.name} is visiting${arrived.sleeping ? ' (napping)' : ''}` : rare ? '✦ Something rare has arrived…' : 'A new visitor has arrived!');
    }
  }

  // ── Clock ─────────────────────────────────────────────────────────────────
  let lastHudMinute = -1;
  let wasNight = null;
  setInterval(() => {
    if (document.hidden) return;
    const evs = G.advance(state, Date.now());
    if (evs.length) {
      handleEvents(evs);
      scene.sync(state);
      save();
      renderCtx();
      renderTabs();
      refreshSheets();
    }
    const m = Math.floor(now() / 30000);
    if (m !== lastHudMinute) {
      lastHudMinute = m;
      renderHud();
      renderBowl();
    }
    const night = lightingAt(now(), state.test.phaseOverride).dark > 0.5;
    if (night !== wasNight) {
      wasNight = night;
      setAmbience(state.active, night);
    }
  }, 1000);
  setInterval(() => !document.hidden && saveNow(), 15000);

  let last = performance.now(),
    acc = 0;
  function frame(t) {
    const dt = Math.min(0.25, (t - last) / 1000);
    last = t;
    acc += dt;
    const step = state.settings.reduceMotion ? 1 / 8 : 1 / 15;
    if (acc >= step && !document.hidden) {
      scene.update(acc);
      scene.draw(now());
      acc = 0;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ── Shop ──────────────────────────────────────────────────────────────────
  let shopTab = 'decor';
  function openShop(tab) {
    if (tab) shopTab = tab;
    openSheet({ title: 'Shop', icon: art.icon('shop', 2), render: (api) => shopBody(api) });
  }
  function buyFeedback(ok, reason) {
    if (ok) {
      sfx('buy');
      scene.sync(state);
      save();
      renderAll();
    } else {
      sfx('error');
      toast(reason === 'funds' ? 'Not enough currency yet.' : reason === 'full' ? 'Your treat pouch is full.' : reason === 'no space' ? 'No free spot for that.' : 'Can’t buy that.');
    }
  }
  function shopBody(api) {
    const seg = h('div', { class: 'seg', role: 'tablist' }, ['decor', 'treats', 'habitats'].map((t) => button({ decor: 'Decor', treats: 'Treats', habitats: 'Habitats' }[t], () => ((shopTab = t), api.refresh()), shopTab === t ? 'on' : '', { role: 'tab', 'aria-selected': String(shopTab === t) })));
    const out = [seg];
    if (shopTab === 'decor') {
      const terr = TERRARIUM_BY_ID[state.active];
      const b = G.decorBonus(state, state.active);
      out.push(h('div', { class: 'note' }, `Decor stays in the ${terr.name} for good and helps only this terrarium.`));
      out.push(h('div', { class: 'bonus-bar' }, h('span', {}, `Rare+ odds +${Math.round(b.rarity * 100)}%`), h('span', {}, `Coin drops +${Math.round(b.coins * 100)}%`), h('span', { style: { color: 'var(--ink-soft)' } }, `caps ${BALANCE.decor.rarityBonusCap * 100}% / ${BALANCE.decor.coinBonusCap * 100}%`)));
      const list = DECOR.filter((d) => d.terrarium === state.active);
      out.push(
        h('div', { class: 'list' },
          list.map((d) => {
            const owned = !!state.decor[state.active][d.id];
            const fx = [d.effect.rarity ? `+${Math.round(d.effect.rarity * 100)}% rare odds` : null, d.effect.coins ? `+${Math.round(d.effect.coins * 100)}% coins` : null].filter(Boolean).join(' · ');
            const side = owned
              ? h('div', { class: 'side' }, h('div', { class: 'owned' }, 'Placed ✓'), button('Move', () => startArrange(d.id), 'btn-sm'))
              : h('div', { class: 'side' }, priceEl(d.cost), button('Buy', () => buyFeedback(...Object.values(G.buyDecor(state, d.id))), 'btn-primary btn-sm', { disabled: !canAfford(d.cost) }));
            return h('div', { class: 'item' }, h('div', { class: 'thumb' }, img(art.decor(d, 2), 'px')), h('div', {}, h('h4', {}, d.name), h('p', {}, d.desc), h('div', { class: 'fx' }, fx + ` · ${d.type} spot`)), side);
          })
        )
      );
    } else if (shopTab === 'treats') {
      out.push(h('div', { class: 'note' }, 'Use treats on a matching visitor. The reward grows with the visitor’s rarity and the treat tier. Each visitor can be fed once.'));
      for (const cat of CATEGORIES) {
        out.push(h('div', { class: 'section-title' }, CAT_PLURAL[cat]));

  crystals(S, a) {

function mixHex(a, b, t) {
  const c = mix(hex(a), hex(b), t);

}

}

    S.mat('vein2', ramp('#4fae4c', { light: '#64c058' }));
    S.mat('stem', ramp('#3e7a34'));

    [...left, ...right].forEach(([x, y, a, l, w, m, c], i) =>

    );
  });

  fall.mask = new Uint8Array((fall.x1 - fall.x0) * (fall.y1 - fall.y0));
  for (let y = fall.y0; y < fall.y1; y++)
    for (let x = fall.x0; x < fall.x1; x++) if (FALL_COLS.includes(L.bg.get(x, y))) fall.mask[(y - fall.y0) * (fall.x1 - fall.x0) + (x - fall.x0)] = 1;
  drawWaterFront(L, p);
  for (let i = 0; i < 6; i++) tuft(L.fg, 70 + i * 6, surfaceY(70 + i * 6) + 1, 5 + (i % 3) * 2, ['#2e6a2a', '#4a9a3a', '#7ac850'], 3 + i);
  drawFrame(L.fg, W, H, { wood: '#6e4528', metal: '#3e4a48' });
  glassGlare(L.fg, W, H);
  return L;
}

  const t = TREAT_BY_ID[treatId];
  if (!t) return { ok: false, reason: 'unknown' };
  const c = treatCost(t);
  const cost = { coins: (c.coins || 0) * qty, gems: (c.gems || 0) * qty };
  const have = state.treats[treatId] || 0;
  if (have + qty > BALANCE.feeding.maxInventoryPerTreat) return { ok: false, reason: 'full' };
  if (!canAfford(state, cost)) return { ok: false, reason: 'funds' };
  pay(state, cost);
  state.treats[treatId] = have + qty;
  return { ok: true };
}

function decorSpotsFor(type) {
  return DECOR_SPOTS.filter((s) => s.type === type);
}

function buyDecor(state, decorId) {
  const d = DECOR_BY_ID[decorId];
  if (!d) return { ok: false, reason: 'unknown' };
  if (!state.unlocked[d.terrarium]) return { ok: false, reason: 'locked' };
  const placed = state.decor[d.terrarium];
  if (placed[decorId]) return { ok: false, reason: 'owned' };
  if (!canAfford(state, d.cost)) return { ok: false, reason: 'funds' };
  const used = new Set(Object.values(placed));
  const spot = decorSpotsFor(d.type).find((s) => !used.has(s.id));
  if (!spot) return { ok: false, reason: 'no space' };
  pay(state, d.cost);
  placed[decorId] = spot.id;
  return { ok: true, spot: spot.id };
}

// Move decor to another spot of the same type, swapping if occupied.
function moveDecor(state, terrId, decorId, spotId) {
  const placed = state.decor[terrId];
  const d = DECOR_BY_ID[decorId];
  const spot = DECOR_SPOTS.find((s) => s.id === spotId);
  if (!placed?.[decorId] || !spot || spot.type !== d.type) return false;
  const other = Object.keys(placed).find((k) => placed[k] === spotId);
  if (other) placed[other] = placed[decorId];
  placed[decorId] = spotId;
  return true;
}

function unlockTerrarium(state, terrId, realNow = Date.now()) {
  const cost = BALANCE.unlockCost[terrId];
  if (state.unlocked[terrId] || !cost) return { ok: false, reason: 'owned' };
  if (!canAfford(state, cost)) return { ok: false, reason: 'funds' };
  pay(state, cost);
  state.unlocked[terrId] = true;
  const now = gameNow(state, realNow);
  const ts = state.terrariums[terrId];
  ts.nextArrivalAt = now + 8000; // first visitor shortly after opening
  ts.visitors = [];
  return { ok: true };
}

// ── Daily treat bowl ────────────────────────────────────────────────────────
function dayKey(t) {
  const d = new Date(t);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dailyAvailable(state, realNow = Date.now()) {
  return state.daily?.last !== dayKey(gameNow(state, realNow));
}
// Claims today's bowl once. Rolls are seeded by save + date, so they can't be
// re-rolled by reloading.
function claimDaily(state, realNow = Date.now()) {
  const key = dayKey(gameNow(state, realNow));
  if (state.daily?.last === key) return { ok: false, reason: 'claimed' };
  const D = BALANCE.daily;
  const rng = makeRng(hashString(String(state.seed) + ':' + key));
  const gifts = [];
  for (const id of unlockedIds(state)) {
    const terr = TERRARIUM_BY_ID[id];
    const got = [];
    for (let i = 0; i < D.treatsPerHabitat; i++) {
      const cat = weightedPick(rng, ['bug', 'reptile', 'aquatic'], (c) => terr.categoryMod[c] ?? 1);
      const tier = weightedPick(rng, [0, 1, 2, 3], (t) => D.tierWeights[t]);
      const treat = Object.values(TREAT_BY_ID).find((t) => t.category === cat && t.tier === tier);
      const have = state.treats[treat.id] || 0;
      state.treats[treat.id] = Math.min(BALANCE.feeding.maxInventoryPerTreat, have + 1);
      got.push(treat.id);
    }
    gifts.push({ terr: id, treats: got });
  }
  state.daily = { ...(state.daily || {}), last: key };
  state.stats.dailies = (state.stats.dailies || 0) + 1;
  return { ok: true, gifts, key };
}

// ── Test tools ───────────────────────────────────────────────────────────────
function testSpawn(state, terrId, spId, realNow = Date.now()) {
  const ts = state.terrariums[terrId];
  const sp = SPECIES_BY_ID[spId];
  const now = gameNow(state, realNow);
  ts.visitors = ts.visitors.filter((v) => v.sp !== spId);
  // make room: remove visitors that block any slot it could use
  if (!freeSlotsFor(ts, sp).length) {
    const sl = SLOTS.find((s) => sp.zones.includes(s.zone));
    const clear = new Set([sl.id, ...(sl.blocks || [])]);
    ts.visitors = ts.visitors.filter((v) => !clear.has(v.slot) && !(SLOT_BY_ID[v.slot].blocks || []).includes(sl.id));
  }
  const pick = pickArrival(state, terrId, now, spId);
  if (!pick) return null;
  const v = makeVisitor(state, terrId, pick, now);
  ts.visitors.push(v);
  ts.visits++;
  return v;
}

function testDepartAll(state, terrId, realNow = Date.now()) {
  const now = gameNow(state, realNow);
  state.terrariums[terrId].visitors.forEach((v) => (v.leavesAt = now));
  return advance(state, realNow);
}

function journalProgress(state) {
  const found = Object.keys(state.journal).length;
  const mastered = Object.values(state.journal).filter((e) => e.stage >= 4).length;
  return { found, total: SPECIES.length, mastered };
}
